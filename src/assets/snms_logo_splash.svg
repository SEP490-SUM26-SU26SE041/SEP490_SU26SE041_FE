<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 80" width="360" height="80">
  <!-- Hex icon mark (left side) -->
  <g transform="translate(0, -10)">
    <polygon points="40,4 74,23 74,57 40,76 6,57 6,23" fill="#1B4332"/>
    <!-- Main stem -->
    <line x1="40" y1="66" x2="40" y2="30" stroke="#52B788" stroke-width="3" stroke-linecap="round"/>
    <!-- Left leaf pair -->
    <path d="M40,48 C33,41 28,34 33,27 C38,20 44,24 40,31" fill="#52B788"/>
    <path d="M40,41 C33,34 29,27 34,21 C39,15 45,19 41,26" fill="#40916C"/>
    <!-- Right leaf pair -->
    <path d="M40,54 C47,47 52,40 47,33 C42,26 36,30 40,37" fill="#52B788"/>
    <path d="M40,47 C47,40 51,33 46,27 C41,21 35,25 39,32" fill="#40916C"/>
    <!-- Top bud -->
    <path d="M40,30 C36,24 35,18 39,13 C43,8 47,13 43,19" fill="#52B788"/>
    <!-- Soil line -->
    <line x1="30" y1="66" x2="50" y2="66" stroke="#40916C" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Brand name -->
  <text x="90" y="32" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1B4332" letter-spacing="0.3">Vườn Ươm</text>
  <text x="90" y="56" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1B4332" letter-spacing="0.3">Thông Minh</text>

  <!-- Decorative dot separator -->
  <circle cx="86" cy="40" r="3" fill="#52B788"/>

  <!-- Subtitle -->
  <text x="92" y="74" font-family="Arial, sans-serif" font-size="11" font-weight="400" fill="#40916C">Hệ Thống Quản Lý Vườn Ươm Thông Minh</text>

  <!-- Decorative underline -->
  <rect x="90" y="78" width="220" height="2" rx="1" fill="#52B788" opacity="0.4"/>
</svg>
